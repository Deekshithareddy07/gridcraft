name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/gridcraft-web/**'
      - 'crates/**'
      - 'packaging/web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly App
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Install Trunk & tools
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: web-pages

      - name: Build Web App with Trunk
        run: |
          cd apps/gridcraft-web
          trunk build --release --dist ../../dist/web --public-url ./

      - name: Prepare static assets
        run: |
          cp packaging/web/_headers packaging/web/.htaccess dist/web/ 2>/dev/null || true
          touch dist/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
